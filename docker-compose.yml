version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: docs_api_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docsapi_user
      POSTGRES_PASSWORD: docsapi_password_2024
      POSTGRES_DB: docsapi_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsapi_user -d docsapi_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - docs_network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: docs_api_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@docsapi.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - docs_network

  backend:
    build:
      context: ./backend/DocsApi
      dockerfile: Dockerfile
    container_name: docs_api_backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >
        Host=postgres;
        Port=5432;
        Database=docsapi_db;
        Username=docsapi_user;
        Password=docsapi_password_2024
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - docs_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docs_api_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - docs_network

volumes:
  postgres_data:
  pgadmin_data:

networks:
  docs_network:
    driver: bridge
