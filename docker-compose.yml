version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: docs_api_postgres
    restart: always
    environment:
      POSTGRES_USER: docsapi_user
      POSTGRES_PASSWORD: docsapi_password_2024
      POSTGRES_DB: docsapi_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docsapi_user -d docsapi_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: docs_api_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@docsapi.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local